name: Remote Repository Dispatch
on:
  push:
  workflow_dispatch:

jobs:
  remote-dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
       - name: Repository Dispatch
         uses: peter-evans/repository-dispatch@v4
         with:
           token: ${{ secrets.BLOG_UPDATE_DISPATCH_PAT }}
           event-type: blog-update
           repository: straorgau/website
